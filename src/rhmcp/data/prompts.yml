initial_instructions: |
  You are connected to Rhino 3D through Rhino MCP.

  Rhino setup:
  - Rhino 8.11 or newer is preferred.
  - Run StartScriptServer inside Rhino before using tools that call rhinocode.
  - Use get_rhino_instances when more than one Rhino process may be running, then pass rhino_id.

  Modeling workflow:
  - Prefer structured tools for common operations: create_rhino_geometry, create_rhino_scene,
    manage_rhino_layer, select_rhino_objects, transform_rhino_objects, and export_rhino_document.
  - Use execute_rhino_python for advanced RhinoScriptSyntax or RhinoCommon operations.
  - When executing Python, assign a JSON-serialisable value to result.
  - Break complex models into named layers and return object ids after creation.
  - For exhaustive API behavior, consult RhinoScriptSyntax and RhinoCommon documentation.

  Visual quality defaults:
  - For site plans, layouts, and architectural geometry: always create planar surfaces
    (rs.AddSrfPt or rs.AddPlanarSrf), not just curves or polylines.
  - Apply distinct display colors per layer using rs.ObjectColor(obj, color) and
    rs.ObjectColorSource(obj, 1) so colors are visible in all display modes.
  - Include a ground plane surface with a neutral colour and a margin around the site.
  - After creating geometry, switch the active viewport to Shaded mode:
    rs.Command("_SetDisplayMode _Mode=Shaded", False)
  - Always call rs.ZoomExtents(None, True) at the end of every script.

rhinoscript_workflow: |
  Before writing any RhinoScript Python code, you MUST follow this workflow:

  1. Look up functions first — call search_rhinoscript_functions or get_rhinoscript_docs
     before writing any code. Never guess function names or signatures.
  2. Check exact signatures — read parameter types, order, and return values carefully.
  3. Pass verified_functions — when calling execute_rhino_python, include the
     verified_functions list naming every rs.* function you are using.
  4. Import correctly — always use `import rhinoscriptsyntax as rs` and call rs.FunctionName().
  5. Assign result — assign a JSON-serialisable value to `result` to return data.

  Anti-hallucination rules:
  - Do NOT guess RhinoScript function names — look them up.
  - Do NOT transpose parameter order — verify the signature.
  - Do NOT invent undocumented parameters — use only what the docs show.
  - If a function is not found in search results, use execute_rhino_python with
    RhinoCommon (import Rhino) as a fallback, or ask the user.

asset_general_strategy: |
  Use this strategy when working with Rhino objects:

  1. Understand the scene first
     - Call get_rhino_document_summary to see object counts, layers, and bounding box.
     - For spatial queries on large scenes, use bbox_filter in get_rhino_objects.

  2. Creating geometry
     - Simple primitives: use create_rhino_geometry or create_rhino_scene.
     - Surfaces from curves: use loft, extrude_curve, or sweep1.
     - Complex or parametric geometry: use execute_rhino_python (follow rhinoscript_workflow).
     - Always create planar surfaces (rs.AddSrfPt / rs.AddPlanarSrf) for site plans and
       layouts — never just curves or polylines.

  3. Modifying objects
     - Name, layer, color: use edit_rhino_object_attributes. Use apply_to_all=True to
       apply changes to every object without listing IDs.
     - Move, rotate, scale: use transform_rhino_objects.
     - Complex changes: use execute_rhino_python.

  4. Querying objects
     - Single object: get_rhino_object_info.
     - Filtered set: get_rhino_objects with layer/type/bbox filters.
     - Current selection: get_selected_rhino_objects.

  5. Visual quality defaults
     - Apply distinct display colors per layer.
     - Include a ground plane with a neutral colour and site margin.
     - Switch viewport to Shaded: rs.Command("_SetDisplayMode _Mode=Shaded", False).
     - Call rs.ZoomExtents(None, True) at the end of every script.

  6. Safety
     - Use undo / redo tools to recover from mistakes.
     - Batch object creation: no more than 50 objects per create_objects call.
     - Use meaningful object names and organise geometry into named layers.

document_reading: |
  When the user provides a PDF, image, spreadsheet, SVG, or Word document, use the
  document reading tools directly — do NOT try to open files with shell commands or
  external programs.

  Workflow for architectural drawings (PDF):
    1. get_pdf_info(path)         → learn page count and page dimensions
    2. read_pdf(path, pages="N")  → render the relevant page(s) as images you can see
    3. Interpret the images directly — extract dimensions, room names, and layout details.

  Tool selection by file type:
    .pdf          → get_pdf_info first, then read_pdf
    .jpg/.png/.tiff/.heic/.webp → read_image
    .csv/.xlsx/.xls             → read_spreadsheet
    .svg/.svgz                  → read_svg  (returns XML + PNG render)
    .docx                       → read_docx

  Key parameters:
    - read_pdf pages: "3", "1-5", "1,3,5-8"  (1-based, up to max_pages=10 per call)
    - read_pdf dpi: 150 default; use 200-300 for fine drawing detail
    - read_image max_dimension: 2048 default; increase for detail work
    - read_spreadsheet sheet: name or 1-based index for Excel files
    - read_svg render_png: true by default — gives you a visual image of the SVG

  For large PDFs: call get_pdf_info first to find which pages contain the relevant
  drawings, then fetch only those pages with read_pdf.

  For scanned PDFs (no text layer): read_pdf still works — pages are returned as
  images. extract_text will return empty strings, which is expected.

  For Excel workbooks with multiple sheets: read_spreadsheet returns sheet_names so
  you can enumerate the workbook, then re-call with sheet="SheetName" to fetch each.
