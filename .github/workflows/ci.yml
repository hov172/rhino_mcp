name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install package and dev dependencies
        run: uv sync --group dev

      - name: Run unit, smoke, and script-syntax tests
        run: |
          uv run pytest \
            tests/test_tools_unit.py \
            tests/test_smoke.py \
            tests/test_script_syntax.py \
            -v --tb=short -m "not integration"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install ruff
        run: uv pip install --system ruff

      - name: Ruff check
        # E701: intentional single-line `if err: return err` validation pattern
        # E402: imports after setup calls (e.g. _configure_cairo_path)
        # E741: ambiguous loop variable `l` in rhinocode.py
        run: |
          ruff check src/rhmcp \
            --select=E,W,F \
            --ignore=E501,E701,E402,E741
