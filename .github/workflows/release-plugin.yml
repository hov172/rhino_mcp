name: Release Rhino plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: [self-hosted, macOS, Rhino]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build plugin
        run: ./scripts/build-plugin.sh

      - name: Package plugin
        run: ./scripts/package-plugin.sh

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rhino_plugin/release/rhino-mcp.rhp
            rhino_plugin/release/rhino-mcp-*.yak
