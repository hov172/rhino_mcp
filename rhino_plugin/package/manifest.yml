name: rhino-mcp
version: 0.12.1
authors:
  - Ayala Solutions
description: >
  MCP socket server plug-in for Rhino 7/8. Exposes 353 tools covering
  geometry creation, Grasshopper automation, layers, materials, rendering,
  BIM (VisualARQ/Lands Design), AI 3D generation, import/export (STEP, IGES,
  DWG, OBJ, FBX, GLB, STL, 3MF, 3DM), full import material/texture fidelity,
  and the UrbanAgent Studio Pipeline. Works with Claude Desktop, Claude Code,
  Cursor, Codex, and any MCP client.
url: https://github.com/hov172/rhino_mcp
keywords:
  - mcp
  - ai
  - automation
  - scripting
  - rhino
  - grasshopper
  - urban-design
  - studio-pipeline
  - claude
  - llm
