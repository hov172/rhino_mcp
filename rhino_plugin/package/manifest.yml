name: rhino-mcp
version: 0.2.0
authors:
  - Rhino MCP Contributors
description: >
  MCP socket server plug-in for Rhino 7/8. Exposes 216 tools covering
  geometry creation, Grasshopper automation, layers, materials, rendering,
  BIM (VisualARQ/Lands Design), AI 3D generation, and the UrbanAgent Studio
  Pipeline (design language, AI renders, solar analysis, PDF report export).
  Works with Claude Desktop, Claude Code, Cursor, Codex, and any MCP client.
url: https://github.com/local/rhino_mcp
keywords:
  - mcp
  - ai
  - automation
  - scripting
  - rhino
  - grasshopper
  - urban-design
  - studio-pipeline
  - claude
  - llm
