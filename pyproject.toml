[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rhino-mcp"
version = "0.2.0"
description = "MCP server for Rhino 3D"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "pyyaml",
    "httpx>=0.27.0",
    "anthropic>=0.25.0",
    "jinja2>=3.1.0",
    "boto3>=1.34.0",
    "pymupdf>=1.23.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "pillow-heif>=0.13.0",
    "python-docx>=1.1.0",
    "cairosvg>=2.7.0",
]

[project.scripts]
rhino-mcp = "rhmcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rhmcp" = [
    "data/*.yml",
    "data/*.md",
    "report_templates/*.jinja2",
    "report_templates/*.css",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a running Rhino 8 instance with rhino-mcp plugin loaded",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
