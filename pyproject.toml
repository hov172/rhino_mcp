[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rhino-mcp"
version = "0.1.0"
description = "MCP server for Rhino 3D"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "pyyaml",
    "httpx>=0.27.0",
]

[project.scripts]
rhino-mcp = "rhmcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rhmcp" = [
    "data/*.yml",
    "data/*.md",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a running Rhino 8 instance with RhinoMCPPlugin loaded",
]
